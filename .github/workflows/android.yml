name: Android APK
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: JavaScript regression tests
        run: node --test tests/probe.test.cjs
      - name: Build, licenses and lint
        run: ./gradlew --no-daemon :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PocketTranspose-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/runtime-licenses.md
            app/build/reports/lint-results-debug.html
          if-no-files-found: error

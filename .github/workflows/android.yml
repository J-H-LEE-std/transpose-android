name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Matches `kotlin { jvmToolchain(21) }` in app/build.gradle.kts.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Injected script regression tests
        run: node --test tests/*.test.cjs

      # assembleDebug also runs checkThirdPartyLicenses (fails on forbidden/unknown licenses).
      - name: Build, license gate and lint
        run: ./gradlew --no-daemon :app:assembleDebug :app:lintDebug

      - name: Upload APK and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PocketTranspose-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/third-party-licenses/third-party-licenses.md
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn

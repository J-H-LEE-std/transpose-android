name: Release

# Push a tag like v0.1.0 on main to build, sign and publish a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Signing secrets live in the "release" environment, whose required reviewers must
    # approve each run before any secret reaches the runner.
    environment: release
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Check the tag matches versionName
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version in app/build.gradle.kts"
            exit 1
          fi

      - name: Injected script regression tests
        run: node --test tests/*.test.cjs

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::Secret RELEASE_KEYSTORE_BASE64 is not set; refusing to publish an unsigned release (see README, Releasing)"
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # assembleRelease also runs checkThirdPartyLicenses and lintVitalRelease.
      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Verify signature and package assets
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk"
          mkdir dist
          cp "$apk" "dist/PocketTranspose-$GITHUB_REF_NAME.apk"
          cp app/build/reports/third-party-licenses/third-party-licenses.md dist/third-party-licenses.md
          (cd dist && sha256sum "PocketTranspose-$GITHUB_REF_NAME.apk" > "PocketTranspose-$GITHUB_REF_NAME.apk.sha256")
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then notes_arg=(--notes-file "$notes"); else notes_arg=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" dist/* --title "PocketTranspose $GITHUB_REF_NAME" "${notes_arg[@]}"

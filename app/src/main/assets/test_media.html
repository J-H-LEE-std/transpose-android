<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PocketTranspose audio test</title>
<style>body{font:18px system-ui;margin:24px;background:#162331;color:#fff}button{padding:12px;margin:8px}audio{width:100%}</style>
<h1>Local audio test</h1><p>Play a generated 440 Hz tone. Start at low device volume. Adjust Gain and Speed below. Disable Preserve pitch to hear pitch change together with speed.</p>
<audio controls loop></audio><button id="replace">Replace audio element</button>
<p>The tone is generated locally. No download or account is needed. Independent pitch shifting is not included.</p>
<script>
const rate=22050, length=rate*2, buffer=new ArrayBuffer(44+length*2), v=new DataView(buffer);
function text(offset,s){for(let i=0;i<s.length;i++)v.setUint8(offset+i,s.charCodeAt(i));}
text(0,'RIFF');v.setUint32(4,36+length*2,true);text(8,'WAVE');text(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);text(36,'data');v.setUint32(40,length*2,true);
for(let i=0;i<length;i++)v.setInt16(44+i*2,Math.sin(2*Math.PI*440*i/rate)*3000,true);
const url=URL.createObjectURL(new Blob([buffer],{type:'audio/wav'}));document.querySelector('audio').src=url;
document.querySelector('#replace').onclick=()=>{const old=document.querySelector('audio');old.pause();const next=document.createElement('audio');next.controls=true;next.loop=true;next.src=url;old.replaceWith(next);};
</script></html>
